<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8B1A1A">
  <title>Gerenciar</title>
  <meta name="description" content="Painel para ver e mudar o status dos pedidos.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css?v=20261004m">
  <style>
    .gerenciar-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .gerenciar-topo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .gerenciar-topo h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -.02em;
      flex: 1;
    }

    .filtros {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: end;
    }

    .filtros .campo {
      min-width: 200px;
    }

    .kanban {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      align-items: start;
    }

    .kanban-coluna {
      background: var(--superficie-2);
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 220px);
      overflow: hidden;
    }

    .kanban-cabecalho {
      padding: 10px 12px;
      font-weight: 800;
      font-size: .9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--borda);
      background: var(--superficie);
      border-radius: var(--raio) var(--raio) 0 0;
    }

    .kanban-contagem {
      background: var(--borda);
      color: var(--texto-suave);
      font-size: .75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .kanban-pedidos {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .kanban-pedido {
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: var(--raio-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,.02);
    }

    .kanban-pedido-cabecalho {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 8px;
    }

    .kanban-pedido-numero {
      font-weight: 800;
      font-size: .95rem;
      color: var(--primaria-texto);
    }

    .kanban-pedido-hora {
      font-size: .75rem;
      color: var(--texto-tenue);
    }

    .kanban-linha {
      font-size: .8rem;
      color: var(--texto-suave);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .kanban-linha strong {
      color: var(--texto);
    }

    .kanban-itens-resumo {
      font-size: .8rem;
      color: var(--texto);
      background: var(--superficie-2);
      border-radius: var(--raio-sm);
      padding: 6px 8px;
      line-height: 1.4;
    }

    .kanban-acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-xs {
      padding: 6px 10px;
      font-size: .8rem;
      border-radius: var(--raio-sm);
    }

    .pedido-detalhes-exp {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--borda);
    }

    .pedido-detalhes-exp.aberto {
      display: flex;
    }

    .detalhe-bloco {
      background: var(--superficie-2);
      border-radius: var(--raio-sm);
      padding: 8px 10px;
      font-size: .8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detalhe-linha {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    .detalhe-linha strong {
      color: var(--texto);
    }

    .personalizacao-bloco {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: .78rem;
      color: var(--texto-suave);
    }

    .personalizacao-item {
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: var(--raio-sm);
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .personalizacao-titulo {
      font-weight: 700;
      color: var(--texto);
    }

    .pedido-vazio {
      text-align: center;
      padding: 40px 16px;
      color: var(--texto-suave);
    }

    .pedido-vazio-icone {
      font-size: 2.4rem;
      display: block;
      margin-bottom: 10px;
    }

    .atualizado-em {
      font-size: .8rem;
      color: var(--texto-tenue);
      text-align: right;
      margin-top: 16px;
    }

    @media (max-width: 1200px) {
      .kanban {
        grid-template-columns: repeat(2, 1fr);
      }
      .kanban-coluna {
        max-height: calc(100vh - 260px);
      }
    }

    @media (max-width: 680px) {
      .kanban {
        grid-template-columns: 1fr;
      }
      .kanban-coluna {
        max-height: none;
      }
      .kanban-pedidos {
        max-height: 420px;
      }
    }
  </style>
</head>
<body>

  <header class="topo">
    <div class="container">
      <div class="topo-principal">
        <div class="marca">
          <div class="marca-logo" aria-hidden="true">📋</div>
          <div class="marca-texto">
            <h1 class="marca-nome">Gerenciar Pedidos</h1>
            <p class="marca-sub" id="marcaSub">Painel de pedidos</p>
          </div>
        </div>
        <a class="btn btn-contorno btn-sm" href="index.html">← Voltar ao cardápio</a>
        <a class="btn btn-contorno btn-sm" href="admin.html">Painel admin</a>
      </div>
    </div>
  </header>

  <main class="gerenciar-container">
    <div class="filtros">
      <div class="campo">
        <label for="filtroData">Filtrar por data</label>
        <input type="date" id="filtroData">
      </div>
      <div class="campo">
        <label for="filtroStatus">Filtrar por status</label>
        <select id="filtroStatus">
          <option value="">Todos os status</option>
        </select>
      </div>
      <button type="button" class="btn btn-contorno" id="btnLimparFiltros">Limpar filtros</button>
      <button type="button" class="btn btn-primario" id="btnAtualizar">🔄 Atualizar</button>
    </div>

    <div id="kanbanContainer">
      <div class="pedido-vazio">
        <span class="pedido-vazio-icone">📋</span>
        <p>Carregando pedidos...</p>
      </div>
    </div>

    <p class="atualizado-em" id="atualizadoEm"></p>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="assets/js/planilha-site.js?v=20261004m"></script>
  <script src="assets/js/planilha.js?v=20261004m"></script>
  <script>
    (function () {
      'use strict';

      var P = window.CardapioPlanilha;
      var el = {};
      var pedidos = [];
      var temporizador = null;

      /* A lista vem do módulo compartilhado (planilha.js), o mesmo que
         a página Acompanhar usa — assim as duas nunca saem de
         sincronia. O último status é "Concluído", igual ao que o
         cliente vê no acompanhamento. Sem argumento aqui: o FILTRO
         precisa mostrar todos, porque ele vale para a lista inteira.
         O seletor de cada pedido usa a lista do tipo dele (abaixo). */
      var STATUS_VALIDOS = (P && P.statusValores)
        ? P.statusValores()
        : ['Novo', 'Preparando', 'Preparado', 'Saiu para entrega', 'Concluído', 'Cancelado'];

      /* Status que fazem sentido para um pedido de certo tipo: um
         pedido de retirada não "saiu para entrega". "Preparado"
         vale para os dois. Tipo vazio/desconhecido mantém a lista
         inteira. */
      function statusDoPedido(tipo) {
        if (P && P.statusValores) return P.statusValores(tipo);
        return STATUS_VALIDOS;
      }

      /* A marca vem do cardapio que este navegador ja guardou, e nao
         de um nome escrito aqui: escrito no HTML, o nome da lanchonete
         envelhece e passa a mostrar o nome antigo em serio. O cache e o
         mesmo `cardapio:data:v1` que a pagina Acompanhar le, e por
         isso nao custa nenhuma requisição a mais. Sem cache (navegador
         novo, aba anônima) o subtítulo fica no texto genérico do HTML. */
      function pintarMarca() {
        var alvo = document.getElementById('marcaSub');
        if (!alvo) return;

        try {
          var bruto = localStorage.getItem('cardapio:data:v1');
          var nome = bruto && (JSON.parse(bruto).config || {}).nome;
          if (nome) {
            alvo.textContent = String(nome);
            document.title = 'Gerenciar - ' + nome;
          }
        } catch (e) { /* modo restrito: fica o texto generico */ }
      }

      function $(sel) { return document.querySelector(sel); }

      function esc(texto) {
        return String(texto == null ? '' : texto)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function moeda(valor) {
        return 'R$ ' + (Number(valor) || 0).toLocaleString('pt-BR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      /* O Sheets devolve a data como Date em texto longo. Para exibir
         encurtamos; para filtrar comparamos dia a dia. Aceita
         dd/mm/aaaa, aaaa-mm-dd e o texto nativo do Sheets. */
      function paraData(texto) {
        var s = String(texto == null ? '' : texto).trim();
        if (!s) return null;
        var br = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
        if (br) return new Date(Number(br[3]), Number(br[2]) - 1, Number(br[1]));
        var iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
        if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
        var d = new Date(s);
        return isNaN(d.getTime()) ? null : d;
      }

      function dataCurta(texto) {
        var d = paraData(texto);
        return d ? d.toLocaleDateString('pt-BR') : String(texto == null ? '' : texto);
      }

      function horaCurta(texto) {
        var s = String(texto == null ? '' : texto).trim();
        if (!s) return '';
        var hm = /(\d{1,2}):(\d{2})/.exec(s);
        if (hm) return ('0' + hm[1]).slice(-2) + ':' + hm[2];
        return s;
      }

      function classeStatus(status) {
        var s = String(status || '').toLowerCase();
        if (s.indexOf('aguard') >= 0) return 'status-aguardando';
        if (s.indexOf('prepar') >= 0 && s.indexOf('preparado') < 0) return 'status-preparando';
        if (s.indexOf('preparado') >= 0) return 'status-preparado';
        if (s.indexOf('saiu') >= 0 || s.indexOf('entrega') >= 0) return 'status-saiu-entrega';
        if (s.indexOf('entregue') >= 0 || s.indexOf('conclu') >= 0) return 'status-entregue';
        return 'status-aguardando';
      }

      function avisar(msg, tipo) {
        var anteriores = el.toasts.querySelectorAll('.toast');
        for (var i = 0; i < anteriores.length; i++) {
          if (anteriores[i].textContent === msg) return;
        }
        while (el.toasts.children.length >= 3) {
          el.toasts.firstElementChild.remove();
        }
        var t = document.createElement('div');
        t.className = 'toast' + (tipo ? ' toast-' + tipo : '');
        t.textContent = msg;
        el.toasts.appendChild(t);
        setTimeout(function () {
          t.style.transition = 'opacity .25s';
          t.style.opacity = '0';
          setTimeout(function () { t.remove(); }, 260);
        }, 2400);
      }

      /* Troca o conteudo da lista preservando a rolagem, para a tela
         nao "pular" para o topo a cada atualizacao. */
      function pintarLista(html) {
        var rolagem = window.scrollY;
        if (el.kanbanContainer) { el.kanbanContainer.innerHTML = html; }
        else if (el.pedidosLista) { el.pedidosLista.innerHTML = html; }
        if (rolagem) window.scrollTo(0, rolagem);
      }

      /* `silencioso` = atualizacao automatica: mantem a lista atual na
         tela em vez de mostrar "Buscando pedidos..." a cada 30 s. */
      function buscarPedidos(silencioso) {
        if (!P || !P.configurada()) {
          pintarLista('<div class="pedido-vazio"><span class="pedido-vazio-icone">⚠️</span><p>Planilha não configurada. Conecte o Google Sheets primeiro.</p></div>');
          return;
        }

        if (!silencioso) {
          pintarLista('<div class="pedido-vazio"><span class="pedido-vazio-icone">⏳</span><p>Buscando pedidos...</p></div>');
        }

        P.lerPedidos().then(function (resp) {
          if (!resp || resp.ok !== true) {
            pintarLista('<div class="pedido-vazio"><span class="pedido-vazio-icone">❌</span><p>' +
              esc((resp && resp.erro) || 'Não foi possível carregar os pedidos.') + '</p></div>');
            return;
          }
          pedidos = resp.pedidos || [];
          renderPedidos();
          el.atualizadoEm.textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
        }).catch(function (erro) {
          pintarLista('<div class="pedido-vazio"><span class="pedido-vazio-icone">❌</span><p>Erro ao buscar pedidos: ' + esc(erro && erro.message ? erro.message : erro) + '</p></div>');
        });
      }

      /* Atualizacao automatica: nao interrompe quem esta mexendo na
         lista (ex.: escolhendo um status) nem rouba o foco. */
      function atualizarAutomatico() {
        var ativo = document.activeElement;
        if (ativo && ((el.kanbanContainer && el.kanbanContainer.contains(ativo)) || (el.pedidosLista && el.pedidosLista.contains(ativo)))) return;
        buscarPedidos(true);
      }

      function renderPedidos() {
        var filtroData = el.filtroData.value;
        var filtroStatus = el.filtroStatus.value;

        var alvoData = filtroData ? new Date(filtroData + 'T00:00:00') : null;

        var filtrados = pedidos.filter(function (p) {
          if (alvoData) {
            var d = paraData(p.data);
            if (!d || d.getFullYear() !== alvoData.getFullYear() ||
                d.getMonth() !== alvoData.getMonth() ||
                d.getDate() !== alvoData.getDate()) return false;
          }
          if (filtroStatus && p.status !== filtroStatus) return false;
          return true;
        });

        if (!filtrados.length) {
          el.kanbanContainer.innerHTML = '<div class="pedido-vazio"><span class="pedido-vazio-icone">📋</span><p>Nenhum pedido encontrado.</p></div>';
          return;
        }

        var colunas = {
          'Novo': [],
          'Pendente': [],
          'Aguardando': [],
          'Preparando': [],
          'Em Preparo': [],
          'Preparado': [],
          'Pronto': [],
          'Saiu para entrega': [],
          'Saiu p/ entrega': [],
          'Saiu p/ Entrega': [],
          'Concluído': [],
          'Entregue': [],
          'Cancelado': []
        };

        filtrados.forEach(function (p) {
          var s = String(p.status || 'Pendente');
          if (s === 'Novo' || s === 'Pendente' || s === 'Aguardando') colunas['Pendente'].push(p);
          else if (s === 'Preparando' || s === 'Em Preparo') colunas['Em Preparo'].push(p);
          else if (s === 'Preparado' || s === 'Pronto') colunas['Pronto'].push(p);
          else if (s === 'Saiu para entrega' || s === 'Saiu p/ entrega' || s === 'Saiu p/ Entrega') colunas['Pronto'].push(p);
          else if (s === 'Concluído' || s === 'Entregue') colunas['Entregue'].push(p);
          else if (s === 'Cancelado') colunas['Pendente'].push(p);
          else colunas['Pendente'].push(p);
        });

        function cardPedido(p) {
          var itensBrutos = Array.isArray(p.itens)
            ? p.itens.map(function (i) {
                var pu = (i.precoUnitario !== undefined && i.precoUnitario !== null) ? i.precoUnitario : (i.precoBase || 0);
                var qtd = i.quantidade || 1;
                return (i.nome || '') + (i.quantidade ? ' (' + i.quantidade + 'x)' : '');
              })
            : String(p.itens || '').split(' | ').filter(Boolean);

          var resumoItens = itensBrutos.slice(0, 3).map(function(x){ return esc(x); }).join('<br>');
          if (itensBrutos.length > 3) resumoItens += '<br><small>+' + (itensBrutos.length - 3) + ' item(s)</small>';

          var statusAtual = String(p.status || 'Pendente');
          var proximo = '';
          var btnAvancar = '';
          if (statusAtual === 'Novo' || statusAtual === 'Pendente' || statusAtual === 'Aguardando' || statusAtual === 'Cancelado') {
            proximo = 'Em Preparo';
            btnAvancar = '<button type="button" class="btn btn-primario btn-xs btn-avancar" data-pedido="' + esc(p.pedido) + '" data-proximo="Em Preparo">Avançar para Em Preparo</button>';
          } else if (statusAtual === 'Preparando' || statusAtual === 'Em Preparo') {
            proximo = 'Pronto';
            btnAvancar = '<button type="button" class="btn btn-primario btn-xs btn-avancar" data-pedido="' + esc(p.pedido) + '" data-proximo="Pronto">Avançar para Pronto</button>';
          } else if (statusAtual === 'Preparado' || statusAtual === 'Pronto' || statusAtual === 'Saiu para entrega' || statusAtual === 'Saiu p/ entrega' || statusAtual === 'Saiu p/ Entrega') {
            proximo = 'Entregue';
            btnAvancar = '<button type="button" class="btn btn-sucesso btn-xs btn-avancar" data-pedido="' + esc(p.pedido) + '" data-proximo="Entregue">Avançar para Entregue</button>';
          } else if (statusAtual === 'Concluído' || statusAtual === 'Entregue') {
            btnAvancar = '';
          }

          var detalhesHtml = '<div class="pedido-detalhes-exp" data-detalhes="' + esc(p.pedido) + '">';

          var blocoInfo = '<div class="detalhe-bloco"><div class="detalhe-linha"><span>Cliente</span><strong>' + esc(p.cliente || '-') + '</strong></div>' +
            '<div class="detalhe-linha"><span>Tipo</span><strong>' + esc(p.tipo || '-') + '</strong></div>' +
            '<div class="detalhe-linha"><span>Pagamento</span><strong>' + esc(p.pagamento || '-') + '</strong></div>' +
            '<div class="detalhe-linha"><span>Data/Hora</span><strong>' + esc(dataCurta(p.data)) + ' ' + esc(horaCurta(p.hora)) + '</strong></div>' +
            '<div class="detalhe-linha"><span>Subtotal</span><strong>' + moeda(p.subtotal || p.total || 0) + '</strong></div>' +
            (p.taxa ? '<div class="detalhe-linha"><span>Taxa Entrega</span><strong>' + moeda(p.taxa) + '</strong></div>' : '') +
            '<div class="detalhe-linha"><span>Total</span><strong>' + moeda(p.total || 0) + '</strong></div>' +
            '</div>';

          detalhesHtml += blocoInfo;

          if (p.endereco || p.bairro) {
            detalhesHtml += '<div class="detalhe-bloco">' +
              (p.endereco ? '<div class="detalhe-linha"><span>Endereço</span><strong>' + esc(p.endereco) + '</strong></div>' : '') +
              (p.bairro ? '<div class="detalhe-linha"><span>Bairro</span><strong>' + esc(p.bairro) + '</strong></div>' : '') +
              '</div>';
          }

          if (p.observacoes) {
            detalhesHtml += '<div class="detalhe-bloco"><strong>Observações</strong><div>' + esc(p.observacoes) + '</div></div>';
          }

          var itensCompletos = Array.isArray(p.itensObj) ? p.itensObj : null;
          if (!itensCompletos && Array.isArray(p.itens)) itensCompletos = p.itens;

          if (itensCompletos && itensCompletos.length) {
            var persHtml = itensCompletos.map(function (it) {
              var temPers = (it.removidos && it.removidos.length) || (it.extras && it.extras.length) || (it.observacao && it.observacao.trim());
              if (!temPers) return '';
              var bloco = '<div class="personalizacao-item"><div class="personalizacao-titulo">' + esc(it.nome || '') + (it.quantidade ? ' (' + it.quantidade + 'x)' : '') + '</div>';
              if (it.removidos && it.removidos.length) bloco += '<div>Removidos: ' + it.removidos.map(esc).join(', ') + '</div>';
              if (it.extras && it.extras.length) {
                var extrasStr = it.extras.map(function(ex){ return esc(ex.nome) + (ex.preco ? ' (R$ ' + Number(ex.preco).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ')' : ''); }).join(', ');
                bloco += '<div>Adicionais: ' + extrasStr + '</div>';
              }
              if (it.observacao && it.observacao.trim()) bloco += '<div>Observações: ' + esc(it.observacao) + '</div>';
              bloco += '</div>';
              return bloco;
            }).join('');
            if (persHtml) detalhesHtml += '<div class="detalhe-bloco"><strong>Personalização</strong><div class="personalizacao-bloco">' + persHtml + '</div></div>';
          } else if (Array.isArray(p.itens) && p.itens.length && typeof p.itens[0] === 'object') {
          }

          detalhesHtml += '</div>';

          return '<div class="kanban-pedido" data-pedido-card="' + esc(p.pedido) + '">' +
            '<div class="kanban-pedido-cabecalho">' +
              '<div><div class="kanban-pedido-numero">Pedido #' + esc(p.pedido) + '</div><div class="kanban-pedido-hora">' + esc(dataCurta(p.data)) + ' • ' + esc(horaCurta(p.hora)) + '</div></div>' +
              '<div class="kanban-pedido-hora">' + moeda(p.total || 0) + '</div>' +
            '</div>' +
            '<div class="kanban-linha"><strong>Cliente:</strong> ' + esc(p.cliente || '-') + '</div>' +
            '<div class="kanban-linha"><strong>Tipo:</strong> ' + esc(p.tipo || '-') + ' • <strong>Pagto:</strong> ' + esc(p.pagamento || '-') + '</div>' +
            (resumoItens ? '<div class="kanban-itens-resumo">' + resumoItens + '</div>' : '') +
            '<div class="kanban-acoes">' +
              btnAvancar +
              '<button type="button" class="btn btn-contorno btn-xs btn-detalhes" data-toggle="' + esc(p.pedido) + '">Ver detalhes</button>' +
            '</div>' +
            detalhesHtml +
          '</div>';
        }

        el.kanbanContainer.innerHTML =
          '<div class="kanban">' +
            '<div class="kanban-coluna"><div class="kanban-cabecalho">Pendentes <span class="kanban-contagem">' + (colunas['Pendente'].length) + '</span></div><div class="kanban-pedidos">' + (colunas['Pendente'].map(cardPedido).join('') || '<div class="pedido-vazio-icone" style="text-align:center;margin:20px 0">📋</div><p style="text-align:center;color:var(--texto-suave);font-size:.85rem">Nenhum</p>') + '</div></div>' +
            '<div class="kanban-coluna"><div class="kanban-cabecalho">Em Preparo <span class="kanban-contagem">' + (colunas['Em Preparo'].length) + '</span></div><div class="kanban-pedidos">' + (colunas['Em Preparo'].map(cardPedido).join('') || '<div style="text-align:center;color:var(--texto-suave);font-size:.85rem;padding:20px 0">Nenhum</div>') + '</div></div>' +
            '<div class="kanban-coluna"><div class="kanban-cabecalho">Prontos <span class="kanban-contagem">' + (colunas['Pronto'].length) + '</span></div><div class="kanban-pedidos">' + (colunas['Pronto'].map(cardPedido).join('') || '<div style="text-align:center;color:var(--texto-suave);font-size:.85rem;padding:20px 0">Nenhum</div>') + '</div></div>' +
            '<div class="kanban-coluna"><div class="kanban-cabecalho">Entregues <span class="kanban-contagem">' + (colunas['Entregue'].length) + '</span></div><div class="kanban-pedidos">' + (colunas['Entregue'].map(cardPedido).join('') || '<div style="text-align:center;color:var(--texto-suave);font-size:.85rem;padding:20px 0">Nenhum</div>') + '</div></div>' +
          '</div>';
      }

      function alterarStatus(pedido, novoStatus) {
        if (!P || !P.configurada()) {
          avisar('Planilha não configurada.', 'erro');
          return;
        }

        P.alterarStatusPedido(pedido, novoStatus).then(function (r) {
          /* `postarLendo` RESOLVE com {ok:false, erro} quando o script
             recusa — ele não rejeita. Antes disto o `.then` ignorava a
             resposta e mostrava o "ok" sempre: token errado, script
             desatualizado ou aba travada viravam "alterado para Em
             preparo", o dono preparava o lanche e o cliente seguia
             vendo "Recebido" na tela Acompanhar. */
          if (!r || r.ok !== true) {
            avisar('NÃO ALTEROU: ' + ((r && r.erro) || 'o script não respondeu.'), 'erro');
            buscarPedidos(true);
            return;
          }

          avisar('Status do pedido #' + pedido + ' alterado para ' + novoStatus, 'ok');
          buscarPedidos(true);
        }).catch(function (erro) {
          avisar('NÃO ALTEROU: ' + erro.message, 'erro');
        });
      }

      /* Preenche o filtro com a MESMA lista usada no seletor de cada
         pedido, para as duas pontas não divergirem. */
      function montarFiltroStatus() {
        var html = '<option value="">Todos os status</option>';
        html += STATUS_VALIDOS.map(function (s) {
          return '<option value="' + esc(s) + '">' + esc(s) + '</option>';
        }).join('');
        el.filtroStatus.innerHTML = html;
      }

      function ligarEventos() {
        el.filtroData.addEventListener('change', renderPedidos);
        el.filtroStatus.addEventListener('change', renderPedidos);

        el.btnLimparFiltros.addEventListener('click', function () {
          el.filtroData.value = '';
          el.filtroStatus.value = '';
          renderPedidos();
        });

        el.btnAtualizar.addEventListener('click', function () { buscarPedidos(); });

        el.kanbanContainer.addEventListener('click', function (ev) {
          var btnAv = ev.target.closest('.btn-avancar');
          if (btnAv) {
            var pedido = btnAv.getAttribute('data-pedido');
            var prox = btnAv.getAttribute('data-proximo');
            if (prox === 'Entregue') {
              if (!confirm('Tem certeza que deseja marcar este pedido como ENTREGUE?')) return;
            }
            if (pedido && prox) alterarStatus(pedido, prox);
            return;
          }
          var btnDet = ev.target.closest('.btn-detalhes');
          if (btnDet) {
            var pid = btnDet.getAttribute('data-toggle');
            var det = document.querySelector('[data-detalhes="' + pid + '"]');
            if (det) {
              det.classList.toggle('aberto');
              btnDet.textContent = det.classList.contains('aberto') ? 'Ocultar detalhes' : 'Ver detalhes';
            }
            return;
          }
        });
      }

      function iniciar() {
        el = {
          filtroData: $('#filtroData'),
          filtroStatus: $('#filtroStatus'),
          btnLimparFiltros: $('#btnLimparFiltros'),
          btnAtualizar: $('#btnAtualizar'),
          kanbanContainer: $('#kanbanContainer'),
          atualizadoEm: $('#atualizadoEm'),
          toasts: $('#toasts')
        };

        montarFiltroStatus();
        pintarMarca();
        ligarEventos();
        buscarPedidos();

        // Atualizar automaticamente a cada 30 segundos (sem interromper quem mexe na lista)
        temporizador = setInterval(atualizarAutomatico, 30000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', iniciar);
      } else {
        iniciar();
      }
    })();
  </script>
</body>
</html>
