<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Mídia Indoor - Smart TV</title>
    <style>
        /* RESET & BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* CONTAINER PRINCIPAL DO PLAYER */
        #app-container {
            display: flex;
            width: 100vw;
            height: calc(100vh - 60px);
            position: relative;
            background-color: #000;
        }

        /* ÁREA DE MÍDIA PRINCIPAL */
        #media-container {
            position: relative;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .layout-full #media-container {
            width: 100vw;
        }

        .layout-split #media-container {
            width: 70vw;
        }

        #media-container img, 
        #media-container video, 
        #media-container iframe {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
            display: block;
        }

        /* PAINEL LATERAL 30% (INFORMATIVOS FIXOS) */
        #sidebar-container {
            width: 30vw;
            height: 100%;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border-left: 2px solid #334155;
            display: none;
            flex-direction: column;
            padding: 24px;
            justify-content: space-between;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        .layout-split #sidebar-container {
            display: flex;
        }

        .sidebar-widget {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .sidebar-logo {
            max-width: 80%;
            max-height: 120px;
            object-fit: contain;
            margin: 0 auto 10px auto;
            display: block;
        }

        .clock-time {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #38bdf8;
            line-height: 1;
        }

        .clock-date {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-top: 8px;
            text-transform: capitalize;
        }

        .weather-temp {
            font-size: 2.5rem;
            font-weight: 700;
            color: #f59e0b;
        }

        .weather-desc {
            font-size: 1rem;
            color: #cbd5e1;
            text-transform: capitalize;
            margin-top: 4px;
        }

        /* BARRA INFERIOR (TICKER RSS) */
        #ticker-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 60px;
            background-color: #090d16;
            border-top: 2px solid #0284c7;
            display: flex;
            align-items: center;
            overflow: hidden;
            z-index: 10;
        }

        .ticker-badge {
            background-color: #0284c7;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            z-index: 2;
            box-shadow: 5px 0 10px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: tickerAnimation var(--ticker-duration, 30s) linear infinite;
        }

        .ticker-item {
            display: inline-block;
            font-size: 1.2rem;
            font-weight: 500;
            color: #f1f5f9;
            padding: 0 30px;
        }

        @keyframes tickerAnimation {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* BOTÃO ENGRENAGEM (CONFIGURAÇÕES) */
        #settings-trigger {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 99;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s;
        }

        #settings-trigger:hover {
            opacity: 1;
            background: rgba(0,0,0,0.8);
        }

        /* MODAIS E PAINEL ADMIN */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: #0284c7;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary { background: #0284c7; color: #fff; }
        .btn-success { background: #16a34a; color: #fff; }
        .btn-secondary { background: #475569; color: #fff; }
        .btn-danger { background: #dc2626; color: #fff; }

        /* TOAST DE NOTIFICAÇÃO */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #16a34a;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* MENSAGEM DE ERRO/AVISO EM TELA */
        .media-error-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            text-align: center;
            padding: 20px;
        }
        .media-error-placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 12px;
            stroke: #475569;
        }
    </style>
</head>
<body class="layout-full">

    <button id="settings-trigger" onclick="openPinModal()">⚙️</button>

    <div id="toast">✅ Playlist atualizada com sucesso!</div>

    <div id="app-container">
        <!-- ÁREA PRINCIPAL DA MÍDIA -->
        <div id="media-container">
            <div class="media-error-placeholder">
                <p>Aguardando programação...</p>
            </div>
        </div>

        <!-- PAINEL LATERAL (MODO SPLIT 70/30) -->
        <div id="sidebar-container">
            <div class="sidebar-widget">
                <img id="side-logo" class="sidebar-logo" src="" alt="Logo" style="display:none;">
            </div>

            <div class="sidebar-widget">
                <div id="clock-time" class="clock-time">00:00</div>
                <div id="clock-date" class="clock-date">Carregando data...</div>
            </div>

            <div class="sidebar-widget">
                <div id="weather-temp" class="weather-temp">--°C</div>
                <div id="weather-desc" class="weather-desc">Atualizando clima...</div>
            </div>
        </div>
    </div>

    <!-- RODAPÉ TICKER RSS -->
    <div id="ticker-bar">
        <div class="ticker-badge">NOTÍCIAS</div>
        <div class="ticker-wrap">
            <div id="ticker-text" class="ticker-move">
                <span class="ticker-item">Sintonizando feed de notícias...</span>
            </div>
        </div>
    </div>

    <!-- MODAL DE PIN -->
    <div id="pin-modal" class="modal-overlay">
        <div class="modal-card" style="max-width: 350px;">
            <div class="modal-title">
                <span>Acesso do Operador</span>
                <span style="cursor:pointer;" onclick="closeModal('pin-modal')">✕</span>
            </div>
            <div class="form-group">
                <label for="input-pin">Digite o PIN de Segurança:</label>
                <input type="password" id="input-pin" class="form-control" placeholder="****" maxlength="8" style="text-align:center; font-size:1.5rem; letter-spacing:4px;">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="validatePin()">Entrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES -->
    <div id="config-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">
                <span>Painel de Configuração</span>
                <span style="cursor:pointer;" onclick="closeModal('config-modal')">✕</span>
            </div>

            <div class="form-group">
                <label for="cfg-json-url">URL da Playlist Remota (JSON):</label>
                <input type="url" id="cfg-json-url" class="form-control" placeholder="https://servidor.com/playlist.json">
            </div>

            <div class="form-group">
                <label for="cfg-ticker-speed">Tempo de Rolagem das Notícias (Segundos):</label>
                <input type="number" id="cfg-ticker-speed" class="form-control" min="5" max="120" value="30" placeholder="Ex: 30">
                <small style="color:#64748b; font-size:0.75rem;">Menos segundos = Rolagem mais rápida | Mais segundos = Rolagem mais lenta</small>
            </div>

            <div class="form-group">
                <label for="cfg-logo-url">URL do Logotipo (PNG/JPG ou Base64):</label>
                <input type="text" id="cfg-logo-url" class="form-control" placeholder="https://servidor.com/logo.png ou data:image/...">
            </div>

            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;">
                    <label for="cfg-weather-city">Cidade (OpenWeather):</label>
                    <input type="text" id="cfg-weather-city" class="form-control" placeholder="Ex: Sao Paulo,BR">
                </div>
                <div class="form-group" style="flex:1;">
                    <label for="cfg-weather-key">API Key (OpenWeather):</label>
                    <input type="text" id="cfg-weather-key" class="form-control" placeholder="Sua Chave API">
                </div>
            </div>

            <div class="form-group">
                <label for="cfg-heartbeat-url">Endpoint de Heartbeat & Audit (POST):</label>
                <input type="url" id="cfg-heartbeat-url" class="form-control" placeholder="https://api.servidor.com/heartbeat">
            </div>

            <div class="form-group">
                <label for="cfg-new-pin">Alterar PIN de Acesso:</label>
                <input type="password" id="cfg-new-pin" class="form-control" placeholder="Novo PIN">
            </div>

            <div class="btn-group">
                <button class="btn btn-success" onclick="forcePlaylistSync()">🔄 Forçar Atualização</button>
                <button class="btn btn-primary" onclick="saveSettings()">💾 Salvar</button>
            </div>

            <div class="btn-group" style="margin-top:10px;">
                <button class="btn btn-secondary" onclick="exportProofOfPlay()">📊 Exportar Logs</button>
                <button class="btn btn-danger" onclick="factoryReset()">⚠️ Reset de Fábrica</button>
            </div>
        </div>
    </div>

    <script>
        /* CONFIGURAÇÕES PADRÃO & ESTADO */
        const DEFAULT_CONFIG = {
            pin: "1234",
            jsonUrl: "",
            tickerSpeed: 30,
            logoUrl: "",
            weatherCity: "Sao Paulo,BR",
            weatherKey: "",
            heartbeatUrl: ""
        };

        let config = { ...DEFAULT_CONFIG };
        let playlist = [];
        let currentMediaIndex = 0;
        let mediaTimer = null;
        let proofOfPlayLogs = [];

        /* INICIALIZAÇÃO DO SISTEMA */
        window.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            initClock();
            fetchWeather();
            fetchNewsRSS();
            loadCachedPlaylist();
            syncPlaylist();

            // Intervalos Globais
            setInterval(syncPlaylist, 60000); // Tenta buscar nova playlist a cada 1 min
            setInterval(fetchWeather, 300000); // Clima a cada 5 min
            setInterval(sendHeartbeat, 300000); // Heartbeat a cada 5 min
        });

        /* GERENCIAMENTO DE CONFIGURAÇÕES (LOCALSTORAGE) */
        function loadConfig() {
            const saved = localStorage.getItem('midia_indoor_config');
            if (saved) {
                try {
                    config = { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
                } catch(e) {
                    config = { ...DEFAULT_CONFIG };
                }
            }
            applyConfigToUI();
        }

        function saveSettings() {
            const newPin = document.getElementById('cfg-new-pin').value.trim();
            if (newPin) config.pin = newPin;

            config.jsonUrl = document.getElementById('cfg-json-url').value.trim();
            config.tickerSpeed = parseInt(document.getElementById('cfg-ticker-speed').value, 10) || 30;
            config.logoUrl = document.getElementById('cfg-logo-url').value.trim();
            config.weatherCity = document.getElementById('cfg-weather-city').value.trim();
            config.weatherKey = document.getElementById('cfg-weather-key').value.trim();
            config.heartbeatUrl = document.getElementById('cfg-heartbeat-url').value.trim();

            localStorage.setItem('midia_indoor_config', JSON.stringify(config));
            applyConfigToUI();
            closeModal('config-modal');
            showToast('Configurações salvas!');
            syncPlaylist();
        }

        function applyConfigToUI() {
            document.getElementById('cfg-json-url').value = config.jsonUrl || '';
            document.getElementById('cfg-ticker-speed').value = config.tickerSpeed || 30;
            document.getElementById('cfg-logo-url').value = config.logoUrl || '';
            document.getElementById('cfg-weather-city').value = config.weatherCity || '';
            document.getElementById('cfg-weather-key').value = config.weatherKey || '';
            document.getElementById('cfg-heartbeat-url').value = config.heartbeatUrl || '';

            // Ajusta velocidade do ticker no CSS
            document.documentElement.style.setProperty('--ticker-duration', `${config.tickerSpeed}s`);

            // Ajusta Logo
            const logoImg = document.getElementById('side-logo');
            if (config.logoUrl) {
                logoImg.src = config.logoUrl;
                logoImg.style.display = 'block';
            } else {
                logoImg.style.display = 'none';
            }
        }

        /* MODAIS E AUTENTICAÇÃO PIN */
        function openPinModal() {
            document.getElementById('input-pin').value = '';
            document.getElementById('pin-modal').style.display = 'flex';
            document.getElementById('input-pin').focus();
        }

        function validatePin() {
            const typedPin = document.getElementById('input-pin').value;
            if (typedPin === config.pin) {
                closeModal('pin-modal');
                document.getElementById('config-modal').style.display = 'flex';
            } else {
                alert('PIN incorreto!');
                document.getElementById('input-pin').value = '';
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        /* CICLO DE REPRODUÇÃO DE MÍDIA */
        function loadCachedPlaylist() {
            const cached = localStorage.getItem('midia_indoor_playlist');
            if (cached) {
                try {
                    playlist = JSON.parse(cached);
                    if (playlist.length > 0) startPlaylistCycle();
                } catch (e) {
                    console.error("Erro ao ler cache da playlist", e);
                }
            }
        }

        async function syncPlaylist() {
            if (!config.jsonUrl) return;

            try {
                const response = await fetch(config.jsonUrl + '?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    const jsonString = JSON.stringify(data);
                    
                    if (localStorage.getItem('midia_indoor_playlist') !== jsonString) {
                        localStorage.setItem('midia_indoor_playlist', jsonString);
                        playlist = data;
                        showToast("Playlist atualizada!");
                        currentMediaIndex = 0;
                        startPlaylistCycle();
                    }
                }
            } catch (err) {
                console.log("Servidor off ou sem internet. Mantendo playlist do cache local.");
            }
        }

        function forcePlaylistSync() {
            syncPlaylist();
            closeModal('config-modal');
        }

        function startPlaylistCycle() {
            if (mediaTimer) clearTimeout(mediaTimer);
            renderNextMedia();
        }

        function renderNextMedia() {
            if (!playlist || playlist.length === 0) {
                displayFallbackPlaceholder("Nenhuma mídia cadastrada na playlist.");
                return;
            }

            const activeItems = filterActivePlaylist(playlist);
            if (activeItems.length === 0) {
                displayFallbackPlaceholder("Nenhuma mídia disponível para o horário/data atual.");
                mediaTimer = setTimeout(renderNextMedia, 10000);
                return;
            }

            if (currentMediaIndex >= activeItems.length) {
                currentMediaIndex = 0;
            }

            const item = activeItems[currentMediaIndex];
            
            // Aplica layout configurado na mídia
            if (item.layout === 'split') {
                document.body.className = 'layout-split';
            } else {
                document.body.className = 'layout-full';
            }

            const container = document.getElementById('media-container');
            container.innerHTML = ''; // Limpa anterior

            const duration = (parseInt(item.duration, 10) || 10) * 1000;

            // Renderiza conforme o tipo
            if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.src;
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                video.onerror = () => handleMediaError(item);
                container.appendChild(video);
            } else if (item.type === 'web') {
                const iframe = document.createElement('iframe');
                iframe.src = item.src;
                container.appendChild(iframe);
            } else { // Imagem (Padrão)
                const img = document.createElement('img');
                img.src = item.src;
                img.onerror = () => handleMediaError(item);
                container.appendChild(img);
            }

            // Auditoria Proof-of-Play
            logProofOfPlay(item);

            currentMediaIndex++;
            mediaTimer = setTimeout(renderNextMedia, duration);
        }

        function handleMediaError(item) {
            console.warn("Falha ao carregar mídia:", item.src);
            displayFallbackPlaceholder(`Mídia indisponível: ${item.title || 'Imagem/Vídeo'}`);
        }

        function displayFallbackPlaceholder(message) {
            const container = document.getElementById('media-container');
            container.innerHTML = `
                <div class="media-error-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <p>${message}</p>
                </div>
            `;
        }

        /* AGENDAMENTO & FILTRAGEM */
        function filterActivePlaylist(items) {
            const now = new Date();
            const currentHour = now.getHours();

            return items.filter(item => {
                // Validação de Data
                if (item.startDate && new Date(item.startDate) > now) return false;
                if (item.endDate) {
                    const end = new Date(item.endDate);
                    end.setHours(23, 59, 59, 999);
                    if (end < now) return false;
                }

                // Validação de Turno
                if (item.shift && item.shift !== 'always') {
                    if (item.shift === 'morning' && (currentHour < 6 || currentHour >= 12)) return false;
                    if (item.shift === 'afternoon' && (currentHour < 12 || currentHour >= 18)) return false;
                    if (item.shift === 'night' && (currentHour < 18 && currentHour >= 6)) return false;
                }

                return true;
            });
        }

        /* PROOF OF PLAY & HEARTBEAT */
        function logProofOfPlay(item) {
            const entry = {
                title: item.title || 'Sem título',
                src: item.src,
                timestamp: new Date().toISOString()
            };
            proofOfPlayLogs.push(entry);
            
            // Mantém no máximo 500 registros locais
            if (proofOfPlayLogs.length > 500) proofOfPlayLogs.shift();
        }

        async function sendHeartbeat() {
            if (!config.heartbeatUrl || proofOfPlayLogs.length === 0) return;

            try {
                const response = await fetch(config.heartbeatUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        deviceId: 'SMART_TV_PLAYER',
                        logs: proofOfPlayLogs
                    })
                });

                if (response.ok) {
                    proofOfPlayLogs = []; // Limpa logs enviados
                }
            } catch (e) {
                console.log("Falha ao enviar Heartbeat/Proof-of-Play");
            }
        }

        function exportProofOfPlay() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(proofOfPlayLogs, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `proof_of_play_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        /* RECURSOS EM TEMPO REAL (RELÓGIO, CLIMA E NOTÍCIAS) */
        function initClock() {
            function updateClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                document.getElementById('clock-time').textContent = `${hours}:${minutes}`;

                const options = { weekday: 'short', day: '2-digit', month: 'short' };
                document.getElementById('clock-date').textContent = now.toLocaleDateString('pt-BR', options);
            }
            updateClock();
            setInterval(updateClock, 10000);
        }

        async function fetchWeather() {
            if (!config.weatherCity || !config.weatherKey) {
                document.getElementById('weather-temp').textContent = "--°C";
                document.getElementById('weather-desc').textContent = "Sem API Key";
                return;
            }

            try {
                const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(config.weatherCity)}&units=metric&lang=pt_br&appid=${config.weatherKey}`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('weather-temp').textContent = `${Math.round(data.main.temp)}°C`;
                    document.getElementById('weather-desc').textContent = data.weather[0].description;
                }
            } catch (e) {
                document.getElementById('weather-desc').textContent = "Indisponível";
            }
        }

        async function fetchNewsRSS() {
            const tickerEl = document.getElementById('ticker-text');
            try {
                // RSS G1 via API proxy pública
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://g1.globo.com/dynamo/rss2.xml');
                if (response.ok) {
                    const data = await response.json();
                    if (data.items && data.items.length > 0) {
                        const newsHTML = data.items.slice(0, 8).map(item => `<span class="ticker-item">• ${item.title}</span>`).join('');
                        tickerEl.innerHTML = newsHTML;
                        return;
                    }
                }
            } catch (e) {
                console.log("Erro ao obter notícias do RSS.");
            }
            // Textos institucionais offline
            tickerEl.innerHTML = `
                <span class="ticker-item">• Bem-vindo à nossa rede de Mídia Indoor</span>
                <span class="ticker-item">• Programação sujeita a alterações sem aviso prévio</span>
                <span class="ticker-item">• Qualidade e excelência no atendimento aos nossos clientes</span>
            `;
        }

        /* UTILITÁRIOS DA UI */
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = "✅ " + msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 6000);
        }

        function factoryReset() {
            if (confirm("Deseja realmente apagar todas as configurações e playlists da TV?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
